# Optional: the native icons are already generated in android/ and ios/.
# Run this only if you want the tool to regenerate them:
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#1F5E4A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  web:
    generate: false
