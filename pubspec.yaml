name: farm_tap
description: "FarmTap — farm and produce-collection records for Western Uganda."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  audio_session: ^0.2.4
  bloc: ^8.1.2
  cached_network_image: ^4.0.6
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  equatable: ^2.0.5
  firebase_ai: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  freezed_annotation: any
  get_it: ^7.7.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: any
  isar: ^3.1.0+1
  isar_community: ^3.4.1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: any
  just_audio: ^0.10.6
  logger: ^2.3.0
  material_symbols_icons: ^4.2960.0
  mobile_scanner: ^7.4.3
  nfc_manager: ^4.2.1
  path_provider: ^2.1.2
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.3.3
  workmanager: ^0.10.10


dev_dependencies:
  bloc_test: any
  build_runner: any
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: any
  isar_community_generator: ^3.4.1
  json_serializable: any
  mocktail: any
  very_good_analysis: any


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/
    - assets/branding/svg/
    - assets/animations/
    - assets/images/avatars/
    - assets/sounds/
    - assets/icon/
    - assets/splash/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit/Outfit-ExtraBold.ttf
          weight: 800
